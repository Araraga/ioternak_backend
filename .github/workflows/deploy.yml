name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            if [ -d "/root/ioternak_backend" ]; then
              cd /root/ioternak_backend
            elif [ -d "/var/www/ioternak-backend" ]; then
              cd /var/www/ioternak-backend
            fi
            git pull origin main
            npm install
            pm2 restart ioternak-backend

